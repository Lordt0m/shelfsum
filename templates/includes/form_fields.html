{% if form.non_field_errors %}<div class="form-errors" role="alert">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}
  {% if field.is_hidden %}{{ field }}{% else %}
  <div class="field{% if field.errors %} field-invalid{% endif %}">
    <label for="{{ field.id_for_label }}">{% if field.name == "DELETE" %}Remove this line{% else %}{{ field.label }}{% endif %}{% if not field.field.required and field.name != "DELETE" %}<span class="optional"> (optional)</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<div class="help-text" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>{% endif %}
    {% if field.errors %}<div class="field-errors" role="alert">{{ field.errors }}</div>{% endif %}
  </div>
  {% endif %}
{% endfor %}
